[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docslicer"
version = "0.2.0"
description = "Deterministic hierarchical document parser and chunker"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Market Framer Inc.", email = "jelle@docslicer.ai" }]
requires-python = ">=3.10"
keywords = [
    "pdf", "docx", "pptx", "html", "document", "document-parsing",
    "text-extraction", "chunking", "rag", "ocr", "tables", "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing",
    "Topic :: Text Processing :: Markup",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "pypdfium2>=5.12",
    "pikepdf>=8.0",
    "pyyaml>=6.0",
    "langdetect>=1.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "httpx>=0.28",
]

[project.optional-dependencies]
llm = [
    "tiktoken>=0.10",
]
html = [
    "playwright>=1.49",
]
ocr = [
    "tesserocr>=2.6",
    "opencv-python>=4.8",
    "Pillow>=10.0",
]
crypto = [
    "msoffcrypto-tool>=5.0",
]
parquet = [
    "pyarrow>=18.0",
]
mcp = [
    "mcp>=1.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
docslicer = "docslicer.cli:main"
docslicer-mcp = "docslicer.mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docslicer = [
    "config/*.yaml",
    "config/*.csv",
    "html/*.js",
    "scraping/*.js",
]

[project.urls]
Homepage = "https://docslicer.ai"
Repository = "https://github.com/DocSlicer/DocSlicer/"
Issues = "https://github.com/DocSlicer/DocSlicer/issues"
Documentation = "https://docslicer.ai/docs"